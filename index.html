<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management</title>
  <style>
    main {
      height: 500px;
      width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin: 20px auto;
      padding: 10px 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }


    main form {
      width: 80%;

    }

    form input {
      width: 100%;
      padding: 5px;
      margin: 5px 0;
      border-radius: 3px;
      border: none;
      background-color: rgb(244, 244, 244);
    }

    form button {
      padding: 5px 10px;
      margin: 5px 0;
      border-radius: 3px;
      border: none;
      background-color: rgb(63, 196, 63);
      font-size: 16px;
      font-weight: bold;
      color: white;
    }

    table {
      width: 90%;
      padding: 3px 6px;
      border: 3px solid black;
      background-color: rgb(211, 198, 174);
      border-radius: 10px;
    }

    table tr th,
    td {
      border: 1px solid black;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 15px;
      font-weight: 400;
    }

    table tr th {
      font-weight: 900;
    }

    .edit {
      background-color: rgb(101 101 216);
      color: white;
      padding: 4px 8px;
      width: 100%;
      border: none;
      font-weight: bold;
      border-radius: 5px;

    }

    .delete {
      background-color: rgb(212, 59, 59);
      color: white;
      padding: 4px 8px;
      width: 100%;
      border: none;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main>
    <h1>Student Management Form</h1>
    <form>
      <label for="userName">Name</label>
      <input type="text" name="userName" id="userName" required>
      <br>
      <label for="rollNo">Roll No:</label>
      <input type="number" name="rollNo" id="rollNo" required>
      <br>
      <label for="age">Age</label>
      <input type="number" name="age" id="age" required>
      <br>
      <label for="email">Email</label>
      <input type="email" name="email" id="email" required>
      <br>
      <button type="submit">Add Student</button>
    </form>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Roll No.</th>
          <th>Age</th>
          <th>Email</th>
          <th colspan="2">Action</th>
        </tr>
      </thead>
      <tbody>

      </tbody>
    </table>
  </main>

  <script>
    const students = [];
    const form = document.querySelector('form');
    let currentIdx = -1;
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      addStudent();
    });

    function addStudent() {
      console.log('addStudent');
      const newStudent = new FormData(form);

      const data = Object.fromEntries(newStudent.entries());

      if (currentIdx !== -1) {
        students[currentIdx] = data;
        currentIdx = -1;
        form.querySelector('button[type="submit"]').textContent = 'Add Student';
      } else {
        students.push(data);
      }
      display();
      form.reset();
    }

    function display() {
      console.log('display');
      const table = document.querySelector('tbody');
      table.innerHTML = '';
      for (let i = 0; i < students.length; i++) {
        table.innerHTML += `
        <tr>
          <td>${students[i].userName}</td>
          <td>${students[i].rollNo}</td>
          <td>${students[i].age}</td>
          <td>${students[i].email}</td>
          <td><button class="edit" onclick="edit(${i})">Edit</button></td>
          <td><button class="delete" onclick="deleteStudent(${i})">Delete</button></td>
        </tr>
      `
      }
    }

    function deleteStudent(idx) {
      console.log('deleteStudent');
      students.splice(idx, 1);
      display();
    };

    function edit(idx) {
      console.log('edit');
      const student = students[idx];
      document.getElementById('userName').value = student.userName;
      document.getElementById('rollNo').value = student.rollNo;
      document.getElementById('age').value = student.age;
      document.getElementById('email').value = student.email;

      form.querySelector('button[type="submit"]').textContent = 'Update Student';
      currentIdx = idx;
    }


  </script>
</body>

</html>
